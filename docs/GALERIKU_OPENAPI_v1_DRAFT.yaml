openapi: 3.1.0
info:
  title: Galeriku Core API
  version: 0.1.0-draft
  description: Kontrak OpenAPI 3.1 untuk Core API Galeriku (Modular Monolith Go).
    Mengacu pada GALERIKU_API_ARCHITECTURE_SPEC.md, PRD.md v2.2, PRD_REVIEW.md, dan
    DATABASE_SPEC.md.
  contact:
    name: Galeriku Architecture Team
    email: architecture@galeriku.com
servers:
- url: https://api.galeriku.com/api/v1
  description: Production API Gateway
- url: https://staging-api.galeriku.com/api/v1
  description: Staging API Gateway
- url: http://localhost:8080/api/v1
  description: Local Development Server
paths:
  /public/events:
    get:
      summary: Daftar event FotoTree publik
      description: Mengembalikan daftar event yang telah dipublikasikan dengan pagination
        berbasis kursor.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: cursor
        in: query
        schema:
          type: string
          nullable: true
      responses:
        '200':
          description: Daftar event berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
                required:
                - data
                - meta
  /public/search/bib:
    get:
      summary: Pencarian kandidat foto berdasarkan nomor BIB
      description: Hanya untuk discovery dan preview publik. Hasil pencarian ini TIDAK
        memberikan hak checkout tanpa verifikasi (DEC-Q02).
      parameters:
      - name: event_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: bib
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Kandidat foto ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhotoPreview'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /checkout-verifications/challenges:
    post:
      summary: Memicu tantangan verifikasi OTP / kode event untuk checkout BIB (DEC-Q02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  format: uuid
                bib_number:
                  type: string
                verification_type:
                  type: string
                  enum:
                  - EVENT_REGISTRATION_OTP
                  - EVENT_ACCESS_CODE
              required:
              - event_id
              - bib_number
              - verification_type
      responses:
        '200':
          description: Tantangan verifikasi berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verification_id:
                        type: string
                        format: uuid
                      destination_hint:
                        type: string
                      expires_in_seconds:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
  /checkout-verifications/verify:
    post:
      summary: Validasi kode OTP/akses dan penerbitan checkout verification grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verification_id:
                  type: string
                  format: uuid
                code:
                  type: string
              required:
              - verification_id
              - code
      responses:
        '200':
          description: Verifikasi sukses dan grant diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      grant_token:
                        type: string
                      scope:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '422':
          $ref: '#/components/responses/BusinessValidationError'
  /checkout/quote:
    post:
      summary: Kalkulasi otoritatif harga dan kelayakan checkout (Zero-Trust Backend)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                verification_grant_tokens:
                  type: array
                  items:
                    type: string
              required:
              - photo_ids
      responses:
        '200':
          description: Kutipan harga otoritatif berhasil dihitung
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      quote_id:
                        type: string
                        format: uuid
                      subtotal_idr:
                        type: integer
                      discount_idr:
                        type: integer
                      total_idr:
                        type: integer
                      currency:
                        type: string
                        example: IDR
                      expires_at:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
  /orders:
    post:
      summary: Membuat pesanan pembelian dari kutipan tervalidasi
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quote_id:
                  type: string
                  format: uuid
              required:
              - quote_id
      responses:
        '201':
          description: Pesanan berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /orders/{orderId}/refund-requests:
    post:
      summary: Mengajukan komplain refund untuk SLA breach atau master rusak (REF-01
        s/d REF-10)
      security:
      - BearerAuth: []
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_item_id:
                  type: string
                  format: uuid
                reason_code:
                  type: string
                  enum:
                  - HIRES_SLA_BREACH
                  - MASTER_LOST
                  - CORRUPT_FILE
                  - GENERATIVE_UPSCALE_REJECTED
                destination_type:
                  type: string
                  enum:
                  - INTERNAL_WALLET
                  - ORIGINAL_PAYMENT_METHOD
                  default: INTERNAL_WALLET
              required:
              - order_item_id
              - reason_code
      responses:
        '201':
          description: Refund disetujui dan diproses ke ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RefundItemDetail'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
  /creator/upload-batches/preflight:
    post:
      summary: Preflight validasi jumlah berkas dan estimasi ukuran sebelum reservasi
        kuota (DEC-Q03)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  format: uuid
                expected_file_count:
                  type: integer
                  maximum: 2000
                expected_bytes:
                  type: integer
              required:
              - event_id
              - expected_file_count
              - expected_bytes
      responses:
        '200':
          description: Preflight disetujui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      eligible:
                        type: boolean
                      remaining_quota_bytes:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
  /creator/upload-batches:
    post:
      summary: Inisiasi batch upload massal 1-2000 file dan reservasi kuota atomik
        di database (DEC-Q03)
      security:
      - BearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  format: uuid
                expected_file_count:
                  type: integer
                  maximum: 2000
                expected_bytes:
                  type: integer
              required:
              - event_id
              - expected_file_count
              - expected_bytes
      responses:
        '201':
          description: Batch dibuat dan kuota berhasil direservasi secara atomik
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      batch_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: RESERVED
                      reserved_bytes:
                        type: integer
                      expires_at:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '422':
          $ref: '#/components/responses/BusinessValidationError'
  /me/privacy/biometric-consents:
    post:
      summary: Pencatatan persetujuan biometrik eksplisit (UU PDP No. 27/2022)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                consent_purpose:
                  type: string
                  example: FACE_SEARCH_DISCOVERY
                policy_version:
                  type: string
                  example: v1.0-202610
              required:
              - consent_purpose
              - policy_version
      responses:
        '201':
          description: Persetujuan biometrik tercatat permanen dalam audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      consent_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: ACTIVE
                      granted_at:
                        type: string
                        format: date-time
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
  /me/privacy/biometric-deletion-requests:
    post:
      summary: Penarikan persetujuan biometrik & pemicuan pembersihan data (Right
        to be Forgotten)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
              - reason
      responses:
        '202':
          description: Permintaan penghapusan diterima, pembersihan vektor di Qdrant
            dimulai
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deletion_job_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: PROCESSING
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
  /auth/register:
    post:
      summary: Registrasi akun pengguna baru
      description: Membuat akun dengan capability awal BUYER dan mengembalikan sesi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - display_name
              properties:
                email:
                  type: string
                  format: email
                phone_e164:
                  type: string
                  example: "+628123456789"
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '409':
          $ref: '#/components/responses/ConflictError'
  /auth/login:
    post:
      summary: Login dan penerbitan sesi
      description: Memverifikasi kredensial dan menerbitkan access token serta refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identifier
              - password
              properties:
                identifier:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Sesi diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
  /auth/refresh:
    post:
      summary: Rotasi refresh token
      description: Menukar refresh token sekali pakai dengan sesi baru. Pemakaian ulang token yang sudah dirotasi mencabut seluruh family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Sesi dirotasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /auth/logout:
    post:
      summary: Mengakhiri sesi
      description: Mencabut refresh token yang dipresentasikan dan mencatat audit pencabutan sesi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Sesi dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
  /auth/me:
    get:
      summary: Profil pengguna saat ini
      description: Mengembalikan profil, capability, dan keanggotaan Host pengguna terautentikasi.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /hosts/apply:
    post:
      summary: Pengajuan pendaftaran organisasi Host
      description: Membuat host_organizations berstatus SUBMITTED beserta host_applications, dengan pemohon sebagai pemilik pengajuan.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - legal_name
              - display_name
              - business_field
              properties:
                legal_name:
                  type: string
                  example: PT Generasi Olahraga Hebat
                display_name:
                  type: string
                  example: Jakarta Marathon Organizer
                business_field:
                  type: string
                  example: Sport Event Organizer
                address_text:
                  type: string
      responses:
        '201':
          description: Pengajuan dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostApplicationEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /hosts/applications/my:
    get:
      summary: Status pengajuan Host pengguna
      description: Mengembalikan pengajuan aktif milik pemanggil beserta jumlah dokumen yang sudah terdaftar.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Pengajuan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyHostApplicationEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /hosts/documents:
    post:
      summary: Presigned URL unggah dokumen legalitas
      description: Menerbitkan presigned S3 PUT URL yang dibatasi ketat pada path legal-documents/{org_id}/ di bucket privat galeriku-master-vault.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - application_id
              - document_type
              - file_name
              properties:
                application_id:
                  type: string
                  format: uuid
                document_type:
                  $ref: '#/components/schemas/HostDocumentType'
                file_name:
                  type: string
                  example: nib_oss_pt_generasi.pdf
                size_bytes:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Presigned URL diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /hosts/documents/{id}/view:
    get:
      summary: Presigned URL baca dokumen legalitas
      description: Menerbitkan presigned S3 GET URL berumur 5 menit. Hanya pemohon, anggota aktif organisasi pemilik, atau pemegang capability SUPER_ADMIN.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Presigned URL diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentViewEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /hosts/organization:
    get:
      summary: Detail organisasi Host
      description: Mengembalikan profil organisasi beserta kuota admin. Dapat diakses Leader dan Admin aktif.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Detail organisasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostOrganizationEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    patch:
      summary: Perubahan detail legal organisasi
      description: Memperbarui legal_name, display_name, atau business_field. Hanya Host Leader aktif.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_name:
                  type: string
                display_name:
                  type: string
                business_field:
                  type: string
      responses:
        '200':
          description: Organisasi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /hosts/members:
    get:
      summary: Daftar anggota organisasi Host
      description: Mengembalikan seluruh keanggotaan organisasi. Dapat diakses Leader dan Admin aktif.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Daftar anggota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostMembersEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /hosts/members/{id}:
    delete:
      summary: Pencabutan keanggotaan
      description: Mencabut satu keanggotaan. Hanya Host Leader aktif; membership Leader tidak dapat dihapus.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Keanggotaan dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /hosts/bank-accounts:
    get:
      summary: Daftar rekening bank Host (masked)
      description: Mengembalikan rekening payout dengan nomor tersensor. Hanya Host Leader aktif.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Daftar rekening
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountsEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Registrasi rekening bank Host
      description: Mendaftarkan rekening payout. Nomor disimpan terenkripsi AES-256-GCM dan setiap mutasi menulis audit_logs. Hanya Host Leader aktif.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bank_code
              - account_number
              - account_holder_name
              properties:
                bank_code:
                  type: string
                  example: BCA
                account_number:
                  type: string
                  example: "1234567890123456"
                account_holder_name:
                  type: string
      responses:
        '201':
          description: Rekening terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /hosts/invitations:
    post:
      summary: Undangan anggota tim Host
      description: Menerbitkan undangan 72 jam; hanya hash SHA-256 token yang disimpan. Hanya Host Leader aktif.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - invited_email
              properties:
                invited_email:
                  type: string
                  format: email
                membership_role:
                  type: string
                  enum:
                  - ADMIN
                  default: ADMIN
      responses:
        '201':
          description: Undangan diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /hosts/invitations/accept:
    post:
      summary: Penerimaan undangan tim Host
      description: Menerima undangan dan membuat keanggotaan ADMIN aktif. Ditolak 422 bila kuota admin penuh dan 410 bila undangan kedaluwarsa.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - invitation_token
              properties:
                invitation_token:
                  type: string
      responses:
        '200':
          description: Undangan diterima
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '410':
          description: Undangan kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Kuota admin penuh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /hosts/invitations/{id}:
    delete:
      summary: Pembatalan undangan tim Host
      description: Membatalkan undangan yang masih PENDING. Hanya Host Leader aktif.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Undangan dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /admin/hosts/applications/{id}/approve:
    post:
      summary: Persetujuan pengajuan Host
      description: Menyetujui pengajuan secara atomik. Mengubah status organisasi dan pengajuan menjadi APPROVED, membuat keanggotaan LEADER aktif, memberi capability HOST_LEADER, dan menginisialisasi kuota admin (default 5).
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pengajuan disetujui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /admin/hosts/applications/{id}/reject:
    post:
      summary: Penolakan pengajuan Host
      description: Menolak pengajuan dengan kode alasan dan mengubah status organisasi menjadi REJECTED.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason_code
              properties:
                reason_code:
                  type: string
      responses:
        '200':
          description: Pengajuan ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /storage/quota:
    get:
      summary: Status kuota penyimpanan organisasi
      description: Mengembalikan limit, pemakaian tertagih, bytes terreservasi, dan sisa kuota.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      responses:
        '200':
          description: Ringkasan kuota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageQuotaEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /storage/upload-batches/initiate:
    post:
      summary: Inisiasi batch upload massal dan reservasi kuota atomik (DEC-Q03)
      description: Mengunci baris kuota dengan SELECT FOR UPDATE sebelum reservasi dibuat, sehingga batch konkuren tidak dapat melampaui limit.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - total_files
              - total_bytes
              - files
              properties:
                event_id:
                  type: string
                  format: uuid
                total_files:
                  type: integer
                  minimum: 1
                  maximum: 2000
                total_bytes:
                  type: integer
                  format: int64
                files:
                  type: array
                  items:
                    type: object
                    required:
                    - client_file_token
                    - expected_bytes
                    properties:
                      client_file_token:
                        type: string
                      original_filename:
                        type: string
                      expected_bytes:
                        type: integer
                        format: int64
      responses:
        '201':
          description: Batch terreservasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadBatchEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Kuota tidak mencukupi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/multipart/initiate:
    post:
      summary: Inisiasi sesi upload multipart S3
      description: Membuka sesi multipart pada bucket privat dengan object key yang dibentuk dari UUID bertipe di bawah prefix raw-uploads/.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - upload_batch_id
              - client_file_token
              properties:
                upload_batch_id:
                  type: string
                  format: uuid
                client_file_token:
                  type: string
      responses:
        '200':
          description: Sesi multipart dibuka
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartInitiateEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /storage/multipart/sign-part:
    post:
      summary: Presigned PUT URL per part (Direct-to-S3)
      description: Menerbitkan presigned URL berumur 30 menit untuk satu part. Nomor part dibatasi 1 sampai 10000.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - upload_item_id
              - part_number
              properties:
                upload_item_id:
                  type: string
                  format: uuid
                part_number:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        '200':
          description: Presigned part URL diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartSignPartEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /storage/multipart/complete:
    post:
      summary: Menutup sesi upload multipart
      description: Menyelesaikan sesi dengan ETag asli dari object storage, lalu mencatat ukuran objek yang terukur sebagai actual_bytes.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - upload_item_id
              - parts
              properties:
                upload_item_id:
                  type: string
                  format: uuid
                parts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - part_number
                    - etag
                    properties:
                      part_number:
                        type: integer
                      etag:
                        type: string
                sha256_checksum:
                  type: string
      responses:
        '200':
          description: Sesi ditutup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartCompleteEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /storage/upload-batches/{id}/finalize:
    post:
      summary: Finalisasi batch dan rekonsiliasi kuota
      description: Merelease reservasi dan menagihkan ukuran objek terukur dalam satu transaksi, menulis storage_usage_entries, dan mengantrikan satu ai_jobs PENDING per objek. Event photo.uploaded dikirim ke RabbitMQ setelah transaksi commit.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrganizationIdHeader'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Batch difinalisasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchFinalizeEnvelope'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT berumur pendek untuk autentikasi pengguna.
  schemas:
    StorageQuotaEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            quota_limit_bytes:
              type: integer
              format: int64
            billable_bytes:
              type: integer
              format: int64
            reserved_bytes:
              type: integer
              format: int64
            remaining_bytes:
              type: integer
              format: int64
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    UploadBatchEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            upload_batch_id:
              type: string
              format: uuid
            status:
              type: string
              example: RESERVED
            reserved_bytes:
              type: integer
              format: int64
            reservation_expires_at:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    MultipartInitiateEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            upload_item_id:
              type: string
              format: uuid
            provider_upload_id:
              type: string
              description: Identitas sesi multipart dari object storage. Berupa string opaque, bukan UUID.
            s3_object_key:
              type: string
              example: raw-uploads/01927c8b-5a12-7800-b611-aaaa11112222/01927c8b-5a12-7800-b611-bbbb22223333/01927c8b-5a12-7800-b611-cccc33334444.jpg
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    MultipartSignPartEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            part_number:
              type: integer
            presigned_url:
              type: string
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    MultipartCompleteEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            upload_item_id:
              type: string
              format: uuid
            status:
              type: string
              example: COMPLETED
            object_key:
              type: string
            actual_bytes:
              type: integer
              format: int64
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    BatchFinalizeEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            upload_batch_id:
              type: string
              format: uuid
            status:
              type: string
              example: COMPLETED
            total_files_uploaded:
              type: integer
            actual_bytes:
              type: integer
              format: int64
            quota_reconciled:
              type: boolean
            event_published:
              type: boolean
              description: True bila seluruh event photo.uploaded berhasil dikirim ke RabbitMQ.
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    CapabilityCode:
      type: string
      enum:
      - BUYER
      - CREATOR
      - HOST_ADMIN
      - HOST_LEADER
      - SUPER_ADMIN
    HostMembershipRole:
      type: string
      enum:
      - LEADER
      - ADMIN
    HostMembershipStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - REVOKED
    HostApplicationStatus:
      type: string
      enum:
      - SUBMITTED
      - APPROVED
      - REJECTED
    HostDocumentType:
      type: string
      enum:
      - KTP_DIREKSI
      - NPWP_BADAN
      - NIB_OSS
      - AKTA_PENDIRIAN
    InvitationStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - REVOKED
      - EXPIRED
    AuthSession:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
            capabilities:
              type: array
              items:
                $ref: '#/components/schemas/CapabilityCode'
    AuthSessionEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthSession'
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    CurrentUserEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
            capabilities:
              type: array
              items:
                $ref: '#/components/schemas/CapabilityCode'
            host_memberships:
              type: array
              items:
                type: object
                properties:
                  organization_id:
                    type: string
                    format: uuid
                  organization_name:
                    type: string
                  role:
                    $ref: '#/components/schemas/HostMembershipRole'
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    LogoutEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            logged_out:
              type: boolean
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    HostApplicationEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            application_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HostApplicationStatus'
            submitted_at:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    MyHostApplicationEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            application_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HostApplicationStatus'
            legal_name:
              type: string
            display_name:
              type: string
            documents_uploaded:
              type: integer
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    DocumentUploadEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            document_id:
              type: string
              format: uuid
            object_key:
              type: string
              example: legal-documents/01927c8b-5a12-7800-b611-aaaa11112222/01927c8b-5a12-7800-b611-c11122223333.pdf
            upload_url:
              type: string
              example: https://vault.galeriku.com/documents/0192.../nib.pdf?X-Amz-Signature=...
            mime_type:
              type: string
            expires_in_seconds:
              type: integer
              example: 900
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    DocumentViewEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            document_id:
              type: string
              format: uuid
            view_url:
              type: string
            expires_in_seconds:
              type: integer
              example: 300
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    HostOrganizationEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            legal_name:
              type: string
            display_name:
              type: string
            business_field:
              type: string
            verification_status:
              $ref: '#/components/schemas/HostApplicationStatus'
            max_admin_count:
              type: integer
              example: 5
            current_admin_count:
              type: integer
              example: 2
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    HostMembersEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            members:
              type: array
              items:
                type: object
                properties:
                  membership_id:
                    type: string
                    format: uuid
                  user_id:
                    type: string
                    format: uuid
                  display_name:
                    type: string
                  role:
                    $ref: '#/components/schemas/HostMembershipRole'
                  status:
                    $ref: '#/components/schemas/HostMembershipStatus'
                  created_at:
                    type: string
                    format: date-time
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    BankAccountEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            bank_code:
              type: string
              example: BCA
            account_number_masked:
              type: string
              example: 1234xxxxxxxx3456
            account_holder_name:
              type: string
            verification_status:
              type: string
              example: PENDING
            created_at:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    BankAccountsEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            bank_accounts:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  bank_code:
                    type: string
                  account_number_masked:
                    type: string
                  account_holder_name:
                    type: string
                  verification_status:
                    type: string
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    InvitationEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            invitation_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/InvitationStatus'
            expires_at:
              type: string
              format: date-time
            invitation_token:
              type: string
              description: Dikembalikan satu kali saat penerbitan; hanya hash SHA-256 yang disimpan.
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    AcceptInvitationEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/HostMembershipStatus'
            role:
              $ref: '#/components/schemas/HostMembershipRole'
            organization_id:
              type: string
              format: uuid
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    ReviewEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            application_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HostApplicationStatus'
            organization_status:
              $ref: '#/components/schemas/HostApplicationStatus'
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    UpdatedEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/SuccessMeta'

    SuccessMeta:
      type: object
      properties:
        request_id:
          type: string
          example: req_01927c8b5a12
        next_cursor:
          type: string
          nullable: true
          example: eyJpZCI6MTIzfQ==
      required:
      - request_id
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: CHECKOUT_VERIFICATION_REQUIRED
            message:
              type: string
              example: Verifikasi event diperlukan sebelum checkout.
            details:
              type: array
              items:
                type: object
            request_id:
              type: string
              example: req_01927c8b5a12
          required:
          - code
          - message
          - request_id
      required:
      - error
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          example: PUBLISHED
        starts_at:
          type: string
          format: date-time
    PhotoPreview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        preview_watermark_url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
        photographer_name:
          type: string
        price_idr:
          type: integer
          example: 45000
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
        status:
          type: string
          example: PENDING_PAYMENT
        total_idr:
          type: integer
          example: 90000
        currency_code:
          type: string
          example: IDR
    RefundItemDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_item_id:
          type: string
          format: uuid
        reason_code:
          type: string
          example: HIRES_SLA_BREACH
        eligible_amount_idr:
          type: integer
          example: 45000
        buyer_credit_amount_idr:
          type: integer
          example: 45000
        creator_clawback_idr:
          type: integer
          example: 31500
        host_clawback_idr:
          type: integer
          example: 6750
        platform_clawback_idr:
          type: integer
          example: 6750
        gateway_fee_idr:
          type: integer
          example: 0
        destination_type:
          type: string
          example: INTERNAL_WALLET
        status:
          type: string
          example: COMPLETED
        completed_at:
          type: string
          format: date-time
  responses:
    UnauthorizedError:
      description: Kredensial tidak ada, tidak valid, atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Pemanggil tidak berwenang atas resource ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Konflik dengan keadaan saat ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Payload tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitedError:
      description: Batas laju terlampaui
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitExceeded:
      description: Batas frekuensi request terlampaui
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BusinessValidationError:
      description: Validasi aturan bisnis gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdempotencyConflict:
      description: Konflik idempotensi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  parameters:
    OrganizationIdHeader:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Identitas organisasi Host target. Diverifikasi terhadap host_memberships sebelum request diteruskan.