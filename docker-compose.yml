services:
  postgres:
    image: postgres:16-alpine
    container_name: galeriku-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-galeriku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-galeriku_secret_pass}
      POSTGRES_DB: ${DB_NAME:-galeriku_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-galeriku} -d ${DB_NAME:-galeriku_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: galeriku-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: galeriku-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: galeriku-qdrant
    restart: always
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: galeriku-minio
    restart: always
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-galeriku_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-galeriku_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: galeriku-backend
    restart: on-failure
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-galeriku}
      DB_PASSWORD: ${DB_PASSWORD:-galeriku_secret_pass}
      DB_NAME: ${DB_NAME:-galeriku_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-galeriku_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-galeriku_minio_secret}
      S3_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-insecure_dev_jwt_secret_change_in_prod}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: galeriku-ai-worker
    restart: on-failure
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-galeriku_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-galeriku_minio_secret}
      S3_USE_SSL: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  qdrantdata:
  miniodata:
